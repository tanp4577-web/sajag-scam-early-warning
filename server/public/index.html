<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sajag Network – Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mut:#56627a;--line:#d6ddea;--acc:#0f766e;--hi:#b42318;--mid:#b54708;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#e8edf7;--mut:#9aa8c4;--line:#2a3958;--acc:#2dd4bf;--hi:#f97066;--mid:#fdb022;--on:#06201c}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#e8edf7;--mut:#9aa8c4;--line:#2a3958;--acc:#2dd4bf;--hi:#f97066;--mid:#fdb022;--on:#06201c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Mukta",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 48px}h1{font-size:2rem;margin:6px 0 0}.sub{color:var(--mut);margin:0 0 10px}
.apirow{font-size:.8rem;color:var(--mut);margin:0 0 14px;word-break:break-all}
.status{font-size:.8rem;margin:-6px 0 12px;color:var(--mut)}.status.on{color:var(--acc)}.status.off{color:var(--hi)}
nav{display:flex;gap:8px;margin-bottom:14px}nav button,.b{padding:11px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button{flex:1}nav button[aria-pressed=true],.b.p{background:var(--acc);border-color:var(--acc);color:var(--on)}
.c{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
select,textarea{width:100%;padding:11px;margin:4px 0 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{font-weight:600}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.85rem;font-weight:600;background:var(--hi);color:var(--on)}.tag.m{background:var(--mid)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mut{color:var(--mut);font-size:.9rem}[hidden]{display:none}
</style></head><body><main>
<h1>Sajag Network</h1><p class="sub">Demo: report a scam, confirm it, alert the village.</p>
<p class="apirow" id="apiStatus"></p>
<nav><button data-t="r">Report</button><button data-t="m">Moderator</button><button data-t="a">Alerts</button></nav>

<section id="r"><div class="c">
<label for="v">Village</label><select id="v"></select>
<label for="ty">What happened?</label><select id="ty"></select>
<label for="nt">Note (optional)</label><textarea id="nt" rows="2"></textarea>
<button class="b p" id="sub">Send report</button> <span id="ok" class="mut"></span></div>
<button class="b" id="seed">Load demo reports</button></section>

<section id="m" hidden><p class="mut">Similar reports from one village are grouped. 3 or more is flagged as a possible outbreak. You decide whether to send an alert.</p><div id="ml"></div></section>

<section id="a" hidden><div class="row" style="margin:0 0 10px"><button class="b" data-l="en">English</button><button class="b" data-l="hi">हिन्दी</button><button class="b" data-l="mr">मराठी</button></div><div id="al"></div></section>
</main>
<script>
// This page is served by the same backend it talks to, so the API is always at
// this page's own address. If you ever open this file on its own (not through
// the server), it falls back to this-device-only storage automatically.
var API_BASE = window.location.origin;
var V=["Shivapur","Ambegaon","Wadgaon","Kasarwadi"];
var TY={
otp:{n:"OTP / KYC / bank message",en:"Fake bank messages asking for OTP or KYC are going around. Never share your OTP.",hi:"OTP या KYC माँगने वाले नकली बैंक मैसेज घूम रहे हैं। OTP किसी को न बताएँ।",mr:"OTP किंवा KYC मागणारे बनावट बँक मेसेज फिरत आहेत. OTP कोणालाही सांगू नका."},
police:{n:"Fake police / officer call",en:"Fake police calls are threatening arrest. Real police never ask for money on a call. Hang up.",hi:"नकली पुलिस कॉल गिरफ्तारी की धमकी दे रहे हैं। असली पुलिस कॉल पर पैसे नहीं माँगती। फ़ोन काट दें।",mr:"बनावट पोलीस कॉल अटकेची धमकी देत आहेत. खरे पोलीस कॉलवर पैसे मागत नाहीत. फोन कट करा."},
prize:{n:"Lottery / prize message",en:"Fake lottery and prize messages are going around. Do not pay any fee to claim a prize.",hi:"नकली लॉटरी और इनाम के मैसेज घूम रहे हैं। इनाम के लिए कोई फीस न दें।",mr:"बनावट लॉटरी आणि बक्षीस मेसेज फिरत आहेत. बक्षिसासाठी कोणतीही फी भरू नका."},
apk:{n:"APK / link to install",en:"Fake challan and bill messages with APK files are going around. Never install files from a message.",hi:"APK फ़ाइल वाले नकली चालान और बिल मैसेज घूम रहे हैं। मैसेज से कोई फ़ाइल इंस्टॉल न करें।",mr:"APK फाइल असलेले बनावट चलन आणि बिल मेसेज फिरत आहेत. मेसेजमधून कोणतीही फाइल इन्स्टॉल करू नका."},
elec:{n:"Electricity bill threat",en:"Fake messages say your electricity will be cut today. Pay only through the official office or app.",hi:"नकली मैसेज कह रहे हैं कि आज बिजली कट जाएगी। भुगतान सिर्फ़ आधिकारिक दफ़्तर या ऐप से करें।",mr:"आज वीज तोडली जाईल असे बनावट मेसेज येत आहेत. पैसे फक्त अधिकृत कार्यालयात किंवा ॲपवर भरा."},
job:{n:"Easy job / earn-from-home offer",en:"Fake work-from-home job offers are going around. No real job asks you to pay first.",hi:"घर बैठे कमाई के नकली ऑफ़र घूम रहे हैं। असली नौकरी में पहले पैसे नहीं माँगे जाते।",mr:"घरबसल्या कमाईच्या बनावट ऑफर फिरत आहेत. खऱ्या नोकरीत आधी पैसे मागत नाहीत."}};
var HEAD={en:"Alert",hi:"चेतावनी",mr:"सावधान"},FOOT={en:"Report fraud: call 1930",hi:"ठगी की शिकायत: 1930 पर कॉल करें",mr:"फसवणुकीची तक्रार: 1930 वर कॉल करा"};
var L="en";
var LOCAL={reports:[],alerts:[]};
function loadLocal(){try{LOCAL=JSON.parse(localStorage.getItem("sajagDemo"))||LOCAL}catch(e){}}
function saveLocal(){try{localStorage.setItem("sajagDemo",JSON.stringify(LOCAL))}catch(e){}}
function $(i){return document.getElementById(i)}
$("v").innerHTML=V.map(function(x){return"<option>"+x+"</option>"}).join("");
$("ty").innerHTML=Object.keys(TY).map(function(k){return'<option value="'+k+'">'+TY[k].n+"</option>"}).join("");

var useServer=false;
function checkServer(){
  fetch(API_BASE+"/api/health").then(function(r){return r.json()}).then(function(d){
    useServer=!!(d&&d.ok);
    $("apiStatus").textContent=useServer?"Connected — reports are shared with everyone using this link.":"Server not responding — using this device only.";
    $("apiStatus").className="status "+(useServer?"on":"off");
  }).catch(function(){
    useServer=false;
    $("apiStatus").textContent="Server not responding — using this device only.";
    $("apiStatus").className="status off";
  });
}
function api(path,opts){return fetch(API_BASE+path,opts).then(function(r){return r.json()})}

var current="r";
function tab(t){current=t;["r","m","a"].forEach(function(x){$(x).hidden=x!==t});document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===t)});if(t=="m")mod();if(t=="a")alerts()}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab(b.dataset.t)}});

$("sub").onclick=function(){
  var body={village:$("v").value,type:$("ty").value,note:$("nt").value,channel:"web"};
  if(useServer){
    api("/api/reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(){$("nt").value="";$("ok").textContent="Report received. Thank you.";setTimeout(function(){$("ok").textContent=""},2500)})
      .catch(function(){$("ok").textContent="Could not reach server."});
  } else {
    LOCAL.reports.push({v:body.village,t:body.type,n:body.note,s:"p",at:Date.now()});saveLocal();
    $("nt").value="";$("ok").textContent="Report received (this device only). Thank you.";setTimeout(function(){$("ok").textContent=""},2500);
  }
};
$("seed").onclick=function(){
  var seeds=[["Shivapur","otp"],["Shivapur","otp"],["Shivapur","otp"],["Ambegaon","apk"],["Wadgaon","job"]];
  if(useServer){
    Promise.all(seeds.map(function(s){return api("/api/reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({village:s[0],type:s[1],channel:"web"})})})).then(function(){tab("m")});
  } else {
    seeds.forEach(function(s){LOCAL.reports.push({v:s[0],t:s[1],n:"",s:"p",at:Date.now()})});saveLocal();tab("m");
  }
};

function mod(){
  if(useServer){
    api("/api/reports").then(function(d){renderMod(d.groups||[],true)}).catch(function(){$("ml").innerHTML='<p class="mut">Could not reach server.</p>'});
  } else {
    var g={};LOCAL.reports.forEach(function(r){if(r.s=="p"){var k=r.v+"|"+r.t;g[k]=(g[k]||0)+1}});
    var groups=Object.keys(g).map(function(k){var p=k.split("|");return{village:p[0],type:p[1],count:g[k],outbreak:g[k]>=3}});
    renderMod(groups,false);
  }
}
function renderMod(groups,remote){
  $("ml").innerHTML=groups.length?groups.map(function(g){return'<div class="c"><b>'+g.village+"</b>: "+TY[g.type].n+' <span class="tag'+(g.outbreak?"":" m")+'">'+g.count+(g.outbreak?" reports · possible outbreak":" report"+(g.count>1?"s":""))+'</span><div class="row"><button class="b p" data-v="'+g.village+'" data-y="'+g.type+'" data-a="confirm">Confirm and alert</button><button class="b" data-v="'+g.village+'" data-y="'+g.type+'" data-a="reject">Reject</button></div></div>'}).join(""):'<p class="mut">No pending reports. Add some on the Report tab.</p>';
  document.querySelectorAll("#ml button").forEach(function(b){b.onclick=function(){
    var village=b.dataset.v,type=b.dataset.y,action=b.dataset.a;
    if(remote){api("/api/reports/"+action,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({village:village,type:type})}).then(function(){mod()})}
    else{var c=0;LOCAL.reports.forEach(function(r){if(r.s=="p"&&r.v==village&&r.t==type){r.s=action=="confirm"?"c":"x";c++}});if(action=="confirm")LOCAL.alerts.unshift({v:village,t:type,n:c,at:Date.now()});saveLocal();mod()}
  }})
}

function alerts(){
  if(useServer){
    api("/api/alerts").then(function(list){renderAlerts((list||[]).map(function(a){return{v:a.village,t:a.type,n:a.reportCount}}))}).catch(function(){$("al").innerHTML='<p class="mut">Could not reach server.</p>'});
  } else {
    renderAlerts(LOCAL.alerts);
  }
}
function renderAlerts(list){
  $("al").innerHTML=list.length?list.map(function(a,i){return'<div class="c"><b>'+HEAD[L]+": "+a.v+'</b> <span class="mut">('+a.n+' reports)</span><p>'+TY[a.t][L]+"</p><p class=\"mut\">"+FOOT[L]+'</p><button class="b" data-i="'+i+'">Play voice</button></div>'}).join(""):'<p class="mut">No confirmed alerts yet. Confirm one in the Moderator tab.</p>';
  document.querySelectorAll("#al button").forEach(function(b){b.onclick=function(){speak(list[b.dataset.i])}})
}

var VOICES=[];function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
try{speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}catch(e){}
var queuedUtters=[];
function splitForSpeech(text){
  var parts=text.split(/(?<=[.।!?])\s+/).filter(Boolean);
  var chunks=[];
  parts.forEach(function(p){
    if(p.length<=28){chunks.push(p);return}
    var words=p.split(" "),cur="";
    words.forEach(function(w){
      if((cur+" "+w).trim().length>28){if(cur)chunks.push(cur.trim());cur=w}else{cur=(cur+" "+w).trim()}
    });
    if(cur)chunks.push(cur.trim());
  });
  return chunks;
}
function speakBrowser(text){
  try{
    speechSynthesis.cancel();queuedUtters=[];
    var wantLang=L=="en"?"en-IN":L=="mr"?"mr-IN":"hi-IN";
    var match=VOICES.find(function(v){return v.lang===wantLang})||VOICES.find(function(v){return v.lang&&v.lang.indexOf(wantLang.split("-")[0])===0});
    var chunks=splitForSpeech(text);
    var i=0;
    function next(){
      if(i>=chunks.length)return;
      var u=new SpeechSynthesisUtterance(chunks[i]);
      if(match){u.voice=match;u.lang=match.lang}else{u.lang=wantLang}
      u.rate=0.9;
      queuedUtters.push(u);
      u.onend=function(){i++;next()};
      u.onerror=function(){i++;next()};
      speechSynthesis.speak(u);
    }
    next();
  }catch(e){}
}
var currentAudio=null;
function speak(a){
  var text=HEAD[L]+". "+a.v+". "+TY[a.t][L];
  if(!useServer){speakBrowser(text);return}
  fetch(API_BASE+"/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,lang:L})})
    .then(function(r){if(!r.ok)throw new Error("no server voice");return r.blob()})
    .then(function(blob){
      if(currentAudio){currentAudio.pause()}
      currentAudio=new Audio(URL.createObjectURL(blob));
      currentAudio.play().catch(function(){speakBrowser(text)});
    })
    .catch(function(){speakBrowser(text)});
}
document.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){L=b.dataset.l;alerts()}});

loadLocal();checkServer();tab("r");
</script></body></html>
